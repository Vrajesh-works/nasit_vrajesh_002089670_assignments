<!DOCTYPE html>
<html>
<head>
    <title>Table CheckList</title>
    <link rel="stylesheet" type="text/css" href="table.css">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body onload="initializePage()">
    <h2 id="userInfo"></h2>

    <table id="myTable">
        <tr>
            <th></th>
            <th>STUDENT</th>
            <th>ADVISOR</th>
            <th>AWARD STATUS</th>
            <th>SEMESTER</th>
            <th>TYPE</th>
            <th>BUDGET #</th>
            <th>PERCENTAGE</th>
            <th>DELETE</th>
            <th>EDIT</th>
        </tr>
        <tr>
            <td><input type="checkbox" onclick="handleCheckbox(this, 1)" /><br /><br /><img src="down.png" width="25px" onclick="toggleRow(1)" /></td>
            <td>Student 1</td>
            <td>Teacher 1</td>
            <td>Approved</td>
            <td>Fall</td>
            <td>TA</td>
            <td>12345</td>
            <td>100%</td>
            <td></td>
            <td></td>
        </tr>
        <tr class="dropDownTextArea" id="dropDown1"><td colspan="10">
            Advisor: Teacher 1<br />
            Award Details: Summer 1-2014 (TA)<br />
            Budget Number: 12345<br />
            Comments: Excellent performance<br />
        </td></tr>
    </table>

    <br /><br />
    <button id="button" disabled>SUBMIT SELECTED AWARDS</button>
    <button id="add" onclick="addNewStudent()">Add New Student</button>

    <nav class="socialmediaicons"></nav>
    <script src="script.js"></script>
</body>
</html>
