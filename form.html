<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starbucks</title>
    <style>
        .error {
            color: red;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<h2>Make Your Order</h2>

<form id="myForm">
    <label for="name">Name:</label>
    <input type="text" id="name" minlength="3" maxlength="20" required>
    <span class="error hidden" id="nameError">Name must be alphanumeric (min 3, max 20 characters)</span><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" pattern="^[a-zA-Z0-9._%+-]+@northeastern.edu$" required>
    <span class="error hidden" id="emailError">Email must be @northeastern.edu</span><br><br>

    <label for="phone">Phone:</label>
    <input type="text" id="phone" pattern="^\d{10}$" required>
    <span class="error hidden" id="phoneError">Phone number must be 10 digits</span><br><br>

    <label for="zip">Zip Code:</label>
    <input type="text" id="zip" pattern="^\d{5}$" required>
    <span class="error hidden" id="zipError">Zip code must be 5 digits</span><br><br>

    <label for="street1">Street Address 1:</label>
    <input type="text" id="street1" required>
    <span class="error hidden" id="street1Error">Street Address 1 is required</span><br><br>

    <label for="street2">Street Address 2 (Optional):</label>
    <input type="text" id="street2"><br><br>

    <label for="list">Select your Order:</label>
    <select id="list" required>
        <option value="">Select your Order</option>
        <option value="option1">Espresso</option>
        <option value="option2">Americano</option>
        <option value="option3">Latte</option>
        <option value="option4">Cappuccino</option>
        <option value="option5">Mocha</option>
    </select>
    <br><br>

    <input type="checkbox" id="dynamicCheckbox">
    <label for="dynamicCheckbox">Comment</label>
    <input type="text" id="dynamicTextField" class="hidden" placeholder="Dynamic Field" required>
    <br><br>

    <button type="submit" id="submitBtn" disabled>Submit</button>
</form>

<table id="dataTable" border="1" style="display:none;">
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Zip</th>
        <th>Street Address 1</th>
        <th>Street Address 2</th>
        <th>Option Selected</th>
        <th>Dynamic Field</th>
    </tr>
    <tbody id="tableBody">
    </tbody>
</table>

<script src="form.js"></script>

</body>
</html>
